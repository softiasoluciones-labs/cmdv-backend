;;;
;;; pgbouncer configuration template for cmdv-backend
;;;
;;; Deploy alongside Postgres (same host or sidecar container).
;;; App connects to pgbouncer on port 6432; pgbouncer connects to Postgres on 5432.
;;;
;;; After installing: sudo apt install pgbouncer  (or use the Docker image bitnami/pgbouncer)
;;;

[databases]
; Replace DB_DATABASE, DB_HOST and DB_PORT with your actual values.
; Example: dev-cmdv = host=127.0.0.1 port=5432 dbname=dev-cmdv
dev-cmdv = host=127.0.0.1 port=5432 dbname=dev-cmdv

[pgbouncer]
;;;
;;; Listening address — app connects here instead of directly to Postgres
;;;
listen_addr = 127.0.0.1
listen_port = 6432

;;;
;;; Pool mode — TRANSACTION is the right choice for Node.js / Sequelize.
;;; Each transaction borrows a server connection and releases it immediately.
;;; SESSION mode would require one Postgres connection per Node.js pool slot.
;;;
pool_mode = transaction

;;;
;;; Pool sizing
;;;
;;; max_client_conn: total connections pgbouncer accepts (all apps combined).
;;; default_pool_size: server-side connections opened toward Postgres per database.
;;;
;;; Formula: default_pool_size < Postgres max_connections - reserved_superuser_slots
;;; On a small VPS (2 GB RAM), keep Postgres max_connections ≤ 50.
;;; Each Postgres connection uses ~5-10 MB RAM on the Postgres side.
;;;
max_client_conn = 100
default_pool_size = 15
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

;;;
;;; Timeouts
;;;
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 30
connect_timeout = 10

;;;
;;; Auth — use md5 or scram-sha-256 depending on your pg_hba.conf
;;;
auth_type = md5
; auth_file points to a file with: "username" "password_md5_hash"
auth_file = /etc/pgbouncer/userlist.txt

;;;
;;; Logging
;;;
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;;;
;;; Admin interface (connect with psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer)
;;;
admin_users = pgbouncer
stats_users = stats_user

;;;
;;; .env changes needed when pgbouncer is active:
;;;   DB_HOST=127.0.0.1
;;;   DB_PORT=6432          ← pgbouncer port, not 5432
;;;   DB_POOL_MAX=5         ← keep small; pgbouncer aggregates upstream
;;;
